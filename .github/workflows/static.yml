name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  # masterブランチにpushされるたびにWebGLビルドして公開。条件はプロジェクトのニーズによって調整してください

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  # 先行ジョブがあればキャンセル

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set CompressionFormat to Disabled
        run: |
          if [ ! -f ProjectSettings/ProjectSettings.asset ]; then
            echo "::error::ProjectSettings/ProjectSettings.asset not found"
            exit 1
          fi
          if ! grep -q 'webGLCompressionFormat:' ProjectSettings/ProjectSettings.asset; then
            echo "::error::webGLCompressionFormat setting not found in ProjectSettings.asset"
            exit 1
          fi
          sed -i -e 's/webGLCompressionFormat: ./webGLCompressionFormat: 2/' ProjectSettings/ProjectSettings.asset
        # Compression Formatを`Disabled`に書き換え

      - uses: game-ci/unity-builder@v3
        with:
          targetPlatform: WebGL
          allowDirtyBuild: true # 上でProjectSettings.assetを変更しているため指定
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE_2022 }}

      - name: Verify build output
        run: |
          if [ ! -d build/WebGL/WebGL ]; then
            echo "::error::Build output directory build/WebGL/WebGL does not exist"
            exit 1
          fi
          if [ -z "$(ls -A build/WebGL/WebGL)" ]; then
            echo "::error::Build output directory is empty"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v2
        with:
          path: build/WebGL/WebGL
        # WebGLビルド出力をアーティファクトにアップロード

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
        # GitHub Pagesに公開
